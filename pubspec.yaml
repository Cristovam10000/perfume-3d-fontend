name: perfume_3d_mvp
description: MVP acadêmico para captura guiada de imagens e visualização 3D de perfumes.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Networking
  dio: ^5.7.0

  # Media / capture
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  path_provider: ^2.1.4

  # Sensores (giroscópio para cobertura de ângulos)
  sensors_plus: ^6.0.1

  # Visão computacional — ORB feature detection para
  # identificar ângulos distintos do perfume entre capturas.
  opencv_dart: ^1.3.0

  # 3D viewer
  model_viewer_plus: ^1.8.0
  intl: ^0.20.2
  google_fonts: ^8.0.2

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
